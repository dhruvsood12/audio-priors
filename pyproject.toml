[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-priors"
version = "0.1.0"
description = "Audio-feature priors for cold-start music recommendation."
requires-python = ">=3.10"
authors = [{ name = "Dhruv Sood", email = "d2sood@ucsd.edu" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandera>=0.20",
    "pydantic>=2.9",
    "typer>=0.12",
    "mlflow>=2.17",
    "faiss-cpu>=1.9",
    "pyarrow>=17.0",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
app = [
    "streamlit>=1.39",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "nbstripout>=0.7",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "pandas-stubs>=2.0",
]

[project.urls]
Homepage = "https://github.com/dhruvsood12/audio-priors"
Repository = "https://github.com/dhruvsood12/audio-priors"

[project.scripts]
audio-priors = "audio_priors.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# typer.Option/Argument in argument defaults is the standard CLI idiom; B008 forbids it.
"scripts/*" = ["B008"]
"src/audio_priors/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/audio_priors"]

[[tool.mypy.overrides]]
module = [
    "IPython.*",
    "seaborn",
    "seaborn.*",
    "sklearn.*",
    "scipy.*",
    "statsmodels.*",
    "shap",
    "shap.*",
    "lightgbm.*",
    "xgboost.*",
    "optuna.*",
    "mlflow.*",
    "pandera.*",
    "faiss.*",
    "kaggle.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "audio_priors.*"
disable_error_code = ["no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src/audio_priors --cov-fail-under=70 --cov-report=term-missing"
