[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songaddiction"
version = "0.1.0"
description = "Audio features as a public proxy for song stickiness; classification of top-quintile popularity."
requires-python = ">=3.10"
authors = [{ name = "Dhruv Sood", email = "d2sood@ucsd.edu" }]
readme = "README.md"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.4",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "pandas-stubs>=2.0",
]

[project.urls]
Homepage = "https://github.com/dhruvsood12/SongAddiction"
Repository = "https://github.com/dhruvsood12/SongAddiction"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "IPython.*",
    "seaborn",
    "seaborn.*",
    "sklearn.*",
    "scipy.*",
    "statsmodels.*",
    "shap",
    "shap.*",
]
ignore_missing_imports = true

# pandas-stubs and sklearn stubs leak Any from many call returns; silencing
# no-any-return for src code keeps strict mypy on for everything else.
[[tool.mypy.overrides]]
module = "src.*"
disable_error_code = ["no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
