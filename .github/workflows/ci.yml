name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q --cov=src --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t songaddiction:ci .
      - name: Run pipeline in container
        run: |
          mkdir -p outputs/figures outputs/tables
          docker run --rm -v "${PWD}/outputs:/app/outputs" songaddiction:ci
      - name: Verify pipeline outputs
        run: |
          test -f outputs/tables/model_metrics.csv
          test -f outputs/figures/13_roc_curves.png
          test -f outputs/figures/14_pr_curves.png
